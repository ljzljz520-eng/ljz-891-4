<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员登录 · 课程软件授权核验站</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="site-header">
  <div class="container">
    <div class="brand"><span class="logo">🎓</span>课程软件授权核验站</div>
    <nav class="header-links"><a href="/">返回查询页</a></nav>
  </div>
</header>

<div class="login-wrap">
  <div class="login-card">
    <h2>管理员登录</h2>
    <div class="sub">请使用管理员账号进入授权管理后台</div>
    <div class="login-msg" id="msg"></div>
    <form id="loginForm">
      <div class="field">
        <label for="username">管理员账号</label>
        <input id="username" autocomplete="username" placeholder="请输入管理员账号" required>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
      </div>
      <button class="btn btn-primary" id="loginBtn" type="submit">登 录</button>
    </form>
    <p class="small muted" style="margin:16px 0 0">初始账号 admin / admin123，登录后请尽快修改密码。</p>
  </div>
</div>

<script>
const msg = document.getElementById('msg');
const btn = document.getElementById('loginBtn');
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) { msg.textContent = '请输入账号和密码'; msg.classList.add('show'); return; }
  btn.disabled = true; btn.textContent = '登录中…';
  try {
    const resp = await fetch('/api/admin/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await resp.json();
    if (data.ok) {
      sessionStorage.setItem('admin_token', data.token);
      sessionStorage.setItem('admin_name', data.username);
      location.href = '/dashboard.html';
    } else {
      msg.textContent = data.message || '账号或密码不正确';
      msg.classList.add('show');
    }
  } catch {
    msg.textContent = '网络异常，请稍后重试';
    msg.classList.add('show');
  } finally {
    btn.disabled = false; btn.textContent = '登 录';
  }
});
</script>
</body>
</html>
